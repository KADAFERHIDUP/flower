<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a0309" />
<title>Boom Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#12020a;color:#f4e4d4;
    font-family:"Playfair Display",Georgia,serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#5a0f26 0%,#2b0713 45%,#12020a 100%)}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
  .fl{position:absolute;left:50%;top:50%;will-change:transform,opacity;pointer-events:none}
  .fl img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45));
    transform-origin:50% 60%}
  .sway img{animation:sway var(--d,6s) ease-in-out var(--dl,0s) infinite alternate}
  @keyframes sway{from{transform:rotate(-2.2deg) scale(1)}to{transform:rotate(2.2deg) scale(1.025)}}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:40;
    background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,214,200,.95),rgba(255,120,150,.35) 30%,transparent 62%)}
  .ring{position:absolute;border-radius:50%;pointer-events:none;border:2px solid rgba(255,200,190,.8);
    box-shadow:0 0 30px rgba(255,120,150,.6),inset 0 0 30px rgba(255,120,150,.4);z-index:45;transform:translate(-50%,-50%) scale(0);opacity:0}
  #intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;
    z-index:30;cursor:pointer;transition:opacity .5s}
  #bud{width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff9db2,#c01641 55%,#6b0b24);
    box-shadow:0 0 40px rgba(255,60,100,.55),0 0 90px rgba(255,60,100,.3);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.18);box-shadow:0 0 60px rgba(255,60,100,.8),0 0 130px rgba(255,60,100,.45)}}
  #intro p{margin:0;font-style:italic;font-size:1.15rem;letter-spacing:.06em;color:rgba(244,228,212,.85)}
  #hint{position:absolute;left:0;right:0;bottom:calc(1.4rem + env(safe-area-inset-bottom));text-align:center;z-index:60;
    font-style:italic;font-size:.95rem;color:rgba(244,228,212,.55);opacity:0;transition:opacity 1s;pointer-events:none}
  #hint.on{opacity:1}
  #hint span{display:inline-block;padding:.35rem .9rem;border-radius:99px;background:rgba(18,2,10,.6);backdrop-filter:blur(4px)}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:70;
    background:#12020a;transition:opacity .6s;font-style:italic;color:rgba(244,228,212,.6)}
</style>
</head>
<body>
<div id="stage">
  <div id="loading">memuat bunga…</div>
  <div id="intro"><div id="bud"></div><p>Sentuh untuk mekar</p></div>
  <div id="flash"></div>
  <canvas id="fx"></canvas>
  <div id="hint"><span>ketuk di mana saja untuk boom lagi ✿</span></div>
</div>

<script>
(function () {
  var N = ['01','02','03','04','07','08','09','10','11','13','17'];   // bunga utama
  var CORNER = ['19','20'];                                                     // hiasan sudut
  var stage = document.getElementById('stage');
  var intro = document.getElementById('intro');
  var hint = document.getElementById('hint');
  var flash = document.getElementById('flash');
  var loading = document.getElementById('loading');
  var canvas = document.getElementById('fx'), ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, booms = 0, ready = false;
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

  /* ---------- muat gambar ---------- */
  var imgs = {}, todo = N.concat(CORNER), left = todo.length;
  todo.forEach(function (id) {
    var im = new Image();
    im.onload = im.onerror = function () { if (--left === 0) { ready = true; loading.style.opacity = 0; setTimeout(function(){loading.remove()}, 700); } };
    im.src = 'assets/f' + id + '.webp'; imgs[id] = im;
  });

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- kelopak (partikel) ---------- */
  var COLORS = ['#7a0f2b', '#a3152f', '#c2284a', '#e8c9b8', '#f4e4d4', '#d98aa0', '#ffb3c1'];
  var petals = [];
  function addPetal(x, y, vx, vy, size, life) {
    petals.push({ x: x, y: y, vx: vx, vy: vy, s: size, r: rand(0, 6.28), vr: rand(-.08, .08), c: pick(COLORS),
      a: 1, t: 0, life: life || 0, sway: rand(0, 6.28) });
  }
  function drawPetal(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.abs(Math.cos(p.t * .05 + p.sway)) * .6 + .4);
    ctx.globalAlpha = p.a; ctx.fillStyle = p.c; ctx.beginPath();
    ctx.moveTo(0, -p.s); ctx.bezierCurveTo(p.s * .9, -p.s * .6, p.s * .8, p.s * .6, 0, p.s);
    ctx.bezierCurveTo(-p.s * .8, p.s * .6, -p.s * .9, -p.s * .6, 0, -p.s); ctx.fill(); ctx.restore();
  }
  var last = 0, ambientT = 0;
  function loop(ts) {
    var dt = Math.min(48, ts - last || 16) / 16; last = ts;
    ctx.clearRect(0, 0, W, H);
    if (booms > 0) { ambientT += dt; if (ambientT > 14 && petals.length < 70) { ambientT = 0; addPetal(rand(0, W), -20, rand(-.3, .3), rand(.6, 1.3), rand(5, 10), 0); } }
    for (var i = petals.length - 1; i >= 0; i--) {
      var p = petals[i]; p.t += dt;
      p.vy += .035 * dt; p.vx *= .992; p.vy *= .992;
      p.x += (p.vx + Math.sin(p.t * .03 + p.sway) * .4) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.life && p.t > p.life) p.a -= .02 * dt;
      if (p.y > H + 30 || p.a <= 0) { petals.splice(i, 1); continue; }
      drawPetal(p);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- efek ledakan ---------- */
  function shock(x, y, big) {
    flash.style.setProperty('--x', x + 'px'); flash.style.setProperty('--y', y + 'px');
    flash.animate([{ opacity: big ? 1 : .55 }, { opacity: 0 }], { duration: big ? 900 : 500, easing: 'ease-out' });
    for (var k = 0; k < (big ? 2 : 1); k++) {
      var r = document.createElement('div'); r.className = 'ring';
      r.style.left = x + 'px'; r.style.top = y + 'px';
      var d = Math.max(W, H) * (big ? 1.6 : .5); r.style.width = r.style.height = d + 'px';
      stage.appendChild(r);
      r.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: .9 }, { transform: 'translate(-50%,-50%) scale(1)', opacity: 0 }],
        { duration: big ? 1200 : 700, delay: k * 160, easing: 'cubic-bezier(.1,.7,.3,1)', fill: 'forwards' }).onfinish = function () { this.effect.target.remove(); };
    }
    var n = big ? 140 : 26;
    for (var i = 0; i < n; i++) {
      var a = rand(0, 6.2832), sp = rand(big ? 3 : 1.5, big ? 12 : 6);
      addPetal(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 1, rand(5, big ? 13 : 9), 90);
    }
  }

  /* ---------- bunga ---------- */
  function makeFlower(id, w, cls) {
    var d = document.createElement('div'); d.className = 'fl' + (cls ? ' ' + cls : '');
    d.style.width = w + 'px';
    var im = document.createElement('img'); im.src = imgs[id].src; im.alt = ''; im.draggable = false;
    d.appendChild(im); stage.insertBefore(d, flash); return d;
  }
  function fly(el, fromX, fromY, toX, toY, rot, delay, dur, scaleTo) {
    // posisi dasar el = tengah layar; transform memindahkannya
    var cx = W / 2, cy = H / 2;
    var start = 'translate(-50%,-50%) translate(' + (fromX - cx) + 'px,' + (fromY - cy) + 'px) rotate(' + rand(-200, 200) + 'deg) scale(0)';
    var end = 'translate(-50%,-50%) translate(' + (toX - cx) + 'px,' + (toY - cy) + 'px) rotate(' + rot + 'deg) scale(' + (scaleTo || 1) + ')';
    el.style.opacity = 0; el.style.transform = start;
    var anim = el.animate([{ transform: start, opacity: 0 }, { opacity: 1, offset: .25 }, { transform: end, opacity: 1 }],
      { duration: dur, delay: delay, easing: 'cubic-bezier(.16,1.1,.3,1.18)', fill: 'forwards' });
    anim.onfinish = function () { el.style.transform = end; el.style.opacity = 1; el.classList.add('sway'); el.style.setProperty('--d', rand(4.5, 7.5) + 's'); el.style.setProperty('--dl', -rand(0, 5) + 's'); try { anim.cancel(); } catch (e) {} };
    return anim;
  }

  var permanent = [];
  function bigBoom(x, y) {
    shock(x, y, true);
    var m = Math.min(W, H), portrait = H > W;
    var base = portrait ? W * .56 : Math.min(H * .46, W * .26);
    // sudut dulu (di belakang)
    var cs = Math.min(W * .5, H * .42, 330);
    [['19', 0, 0, 1, 1], ['20', 1, 0, -1, 1], ['20', 0, 1, 1, -1], ['19', 1, 1, -1, -1]].forEach(function (c, i) {
      var el = makeFlower(c[0], cs); var ix = c[1] ? W - cs * .5 + 6 : cs * .5 - 6; var iy = c[2] ? H - cs * .62 + 6 : cs * .62 - 6;
      var cx = W / 2, cy = H / 2, end = 'translate(-50%,-50%) translate(' + (ix - cx) + 'px,' + (iy - cy) + 'px) scale(' + c[3] + ',' + c[4] + ')';
      var st = 'translate(-50%,-50%) translate(' + (x - cx) + 'px,' + (y - cy) + 'px) scale(0)';
      el.style.opacity = 0; el.style.transform = st; el.style.zIndex = 1;
      el.animate([{ transform: st, opacity: 0 }, { opacity: 1, offset: .3 }, { transform: end, opacity: .96 }],
        { duration: 1500, delay: 500 + i * 120, easing: 'cubic-bezier(.16,1.05,.3,1.1)', fill: 'forwards' });
      permanent.push(el);
    });
    // cincin-cincin bunga utama
    var ids = N.slice().sort(function () { return Math.random() - .5; });
    var rings = [[1, 0], [4, .42], [6, .82]], k = 0, z = 2;
    var cx0 = W / 2, cy0 = H / 2, rx = W * .5, ry = H * .5;
    rings.forEach(function (rg, ri) {
      for (var j = 0; j < rg[0]; j++) {
        var id = ids[k++ % ids.length];
        var ang = (j / rg[0]) * 6.2832 + rand(-.3, .3) + ri;
        var rad = rg[1] * (ri === 2 ? 1.0 : 1.0);
        var tx = cx0 + Math.cos(ang) * rx * rad * .8, ty = cy0 + Math.sin(ang) * ry * rad * .78;
        var w = base * (ri === 0 ? 1.15 : ri === 1 ? .9 : .72) * rand(.88, 1.12);
        var el = makeFlower(id, w); el.style.zIndex = z++;
        fly(el, x, y, tx, ty, rand(-24, 24), 120 + (ri * 5 + j) * 70, rand(1300, 1800), 1);
        permanent.push(el);
      }
    });
    // ledakan susulan
    setTimeout(function () { shock(x, y, false); }, 450);
    setTimeout(function () { hint.classList.add('on'); }, 3200);
  }

  var minis = [];
  function miniBoom(x, y) {
    shock(x, y, false);
    var n = 3 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) {
      var id = pick(N), w = Math.min(W, H) * rand(.2, .34);
      var el = makeFlower(id, w); el.style.zIndex = 20 + i;
      var a = rand(0, 6.2832), dist = rand(60, Math.min(W, H) * .3);
      var anim = fly(el, x, y, x + Math.cos(a) * dist, y + Math.sin(a) * dist, rand(-35, 35), i * 60, rand(900, 1300));
      minis.push(el);
      (function (e) { setTimeout(function () {
        e.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1600, fill: 'forwards' }).onfinish = function () { e.remove(); };
        minis.splice(minis.indexOf(e), 1);
      }, 6500); })(el);
    }
    while (minis.length > 26) { minis.shift().remove(); }
  }

  /* ---------- sentuhan ---------- */
  function onTap(e) {
    if (!ready) return;
    var t = e.touches ? e.touches[0] : e, x = t.clientX, y = t.clientY;
    if (booms === 0) {
      booms = 1; intro.style.opacity = 0; intro.style.pointerEvents = 'none'; setTimeout(function () { intro.remove(); }, 500);
      bigBoom(x, y);
    } else { booms++; miniBoom(x, y); }
  }
  stage.addEventListener('pointerdown', onTap);
})();
</script>
</body>
</html>
